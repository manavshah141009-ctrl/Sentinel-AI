apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
  labels:
    app: sentinel-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-backend
  template:
    metadata:
      labels:
        app: sentinel-backend
    spec:
      containers:
        - name: backend
          image: sentinel-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: secret-key
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend
spec:
  selector:
    app: sentinel-backend
  ports:
    - port: 8000
      targetPort: 8000
